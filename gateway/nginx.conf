# Main nginx.conf (used by both gateways). Limits are raised above the defaults
# so the gateway does not become the bottleneck during stress tests.
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 8192;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Access log is off during load tests (disk I/O can skew the results).
  access_log off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 60s;
  keepalive_requests 100000;

  include /etc/nginx/conf.d/*.conf;
}
