# =====================================================================
#  MICROSERVICES API Gateway
#  Routes each request to the right service based on its path.
#  The services' /internal/* endpoints are NEVER exposed here.
#  Each upstream can be scaled independently:
#    docker compose -f docker-compose.microservices.yml up -d --scale order-service=3
# =====================================================================
upstream user_service {
  zone user_service 64k;
  resolver 127.0.0.11 valid=5s ipv6=off;
  server user-service:3000 resolve;
  keepalive 64;
}
upstream product_service {
  zone product_service 64k;
  resolver 127.0.0.11 valid=5s ipv6=off;
  server product-service:3000 resolve;
  keepalive 128;
}
upstream order_service {
  zone order_service 64k;
  resolver 127.0.0.11 valid=5s ipv6=off;
  server order-service:3000 resolve;
  keepalive 128;
}
upstream notification_service {
  zone notification_service 64k;
  resolver 127.0.0.11 valid=5s ipv6=off;
  server notification-service:3000 resolve;
  keepalive 32;
}

# Shared proxy settings for every route
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Request-Id $request_id;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;

server {
  listen 80;

  add_header X-Served-By $upstream_addr always;
  add_header X-Architecture microservices always;

  location = /api/info {
    default_type application/json;
    return 200 '{"arch":"microservices","gateway":"nginx"}';
  }

  location /api/users         { proxy_pass http://user_service; }
  location /api/products      { proxy_pass http://product_service; }
  location /api/orders        { proxy_pass http://order_service; }
  location /api/notifications { proxy_pass http://notification_service; }

  location /api/ {
    default_type application/json;
    return 404 '{"error":{"code":"NOT_FOUND","message":"Route not recognized by the API gateway"}}';
  }

  location = /nginx_status {
    stub_status;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
