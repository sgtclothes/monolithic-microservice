# =====================================================================
#  MONOLITH Gateway
#  Every /api/* request is forwarded to ONE kind of app: the monolith.
#  When scaled out (docker compose --scale monolith=3), nginx automatically
#  spreads the load across all replicas (Docker DNS is re-resolved every 5 seconds).
# =====================================================================
upstream monolith_app {
  zone monolith_app 64k;
  resolver 127.0.0.11 valid=5s ipv6=off;
  server monolith:3000 resolve;
  keepalive 256;
}

server {
  listen 80;

  location = /api/info {
    default_type application/json;
    return 200 '{"arch":"monolith","gateway":"nginx"}';
  }

  location /api/ {
    proxy_pass http://monolith_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    # This header shows which replica served the request (handy for the scaling demo)
    add_header X-Served-By $upstream_addr always;
    add_header X-Architecture monolith always;
  }

  location = /nginx_status {
    stub_status;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
