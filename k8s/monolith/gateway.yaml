apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app: gateway }
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - { name: http, containerPort: 80 }
          resources:
            requests: { cpu: "250m", memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
          readinessProbe:
            httpGet: { path: /api/info, port: http }
            periodSeconds: 5
          volumeMounts:
            - { name: nginx-main, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf }
            - { name: nginx-site, mountPath: /etc/nginx/conf.d }
            - { name: storefront, mountPath: /usr/share/nginx/html }
      volumes:
        - name: nginx-main
          configMap: { name: gateway-nginx-main }
        - name: nginx-site
          configMap: { name: gateway-nginx-site }
        - name: storefront
          configMap: { name: storefront }
---
# NodePort: access from outside the cluster -> http://<NODE-IP>:30081
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: NodePort
  selector: { app: gateway }
  ports:
    - { name: http, port: 80, targetPort: http, nodePort: 30081 }
