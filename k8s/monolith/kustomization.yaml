# Apply with:  ./scripts/k8s.sh apply mono
# (needs --load-restrictor=LoadRestrictionsNone because it uses files from the gateway/ folder)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tokoku-mono
resources:
  - namespace.yaml
  - postgres.yaml
  - monolith.yaml
  - gateway.yaml
configMapGenerator:
  - name: gateway-nginx-main
    files: [../../gateway/nginx.conf]
  - name: gateway-nginx-site
    files: [default.conf=gateway.conf]
  - name: storefront
    files: [../../gateway/storefront/index.html]
generatorOptions:
  disableNameSuffixHash: false
