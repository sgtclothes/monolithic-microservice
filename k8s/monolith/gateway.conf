upstream monolith_app {
  zone monolith_app 64k;
  resolver kube-dns.kube-system.svc.cluster.local valid=5s ipv6=off;
  server monolith-headless.tokoku-mono.svc.cluster.local:3000 resolve;
  keepalive 256;
}

server {
  listen 80;

  location = /api/info {
    default_type application/json;
    return 200 '{"arch":"monolith","gateway":"nginx","platform":"kubernetes"}';
  }

  location /api/ {
    proxy_pass http://monolith_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 30s;
    add_header X-Served-By $upstream_addr always;
    add_header X-Architecture monolith always;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
