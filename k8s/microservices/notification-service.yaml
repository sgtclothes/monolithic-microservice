# notification-service: consumer of the order.paid event
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels: { app: notification-service, tokoku.io/arch: microservices }
spec:
  replicas: 1
  selector:
    matchLabels: { app: notification-service }
  template:
    metadata:
      labels: { app: notification-service, tokoku.io/arch: microservices, tokoku.io/metrics: "true" }
    spec:
      terminationGracePeriodSeconds: 15
      enableServiceLinks: false # do not inject *_PORT env vars from other Services
      containers:
        - name: app
          image: tokoku/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000 }
            - { name: metrics, containerPort: 9100 }
          env:
            - name: SERVICE_NAME
              value: "notification-service"
            - name: DATABASE_URL
              value: "postgres://notification_svc:notification_svc@postgres:5432/notification_db"
            - name: DB_POOL_MAX
              value: "2"
            - name: THIRDPARTY_URL
              value: "http://thirdparty-mock.tokoku-infra.svc.cluster.local:4000"
            - name: JWT_SECRET
              value: "tokoku-demo-secret"
            - name: PASSWORD_HASH_ITERATIONS
              value: "100000"
            - name: FRAUD_CHECK_ROUNDS
              value: "2000"
            - name: RABBITMQ_URL
              value: "amqp://tokoku:tokoku@rabbitmq:5672"
            - name: WORKERS
              value: "1"
          # requests = limits -> QoS "Guaranteed", same resources as the docker compose version
          resources:
            requests: { cpu: "300m", memory: 128Mi }
            limits: { cpu: "300m", memory: 128Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels: { app: notification-service }
spec:
  selector: { app: notification-service }
  ports:
    - { name: http, port: 3000, targetPort: http }
---
# Headless service: DNS returns the IPs of ALL pods -> nginx balances load per request
# and picks up new pods automatically on scale (same as Docker DNS in compose).
apiVersion: v1
kind: Service
metadata:
  name: notification-service-headless
spec:
  clusterIP: None
  selector: { app: notification-service }
  ports:
    - { name: http, port: 3000, targetPort: http }
