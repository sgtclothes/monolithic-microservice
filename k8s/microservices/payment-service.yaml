# payment-service: calls the payment gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels: { app: payment-service, tokoku.io/arch: microservices }
spec:
  replicas: 1
  selector:
    matchLabels: { app: payment-service }
  template:
    metadata:
      labels: { app: payment-service, tokoku.io/arch: microservices, tokoku.io/metrics: "true" }
    spec:
      terminationGracePeriodSeconds: 15
      enableServiceLinks: false # do not inject *_PORT env vars from other Services
      containers:
        - name: app
          image: tokoku/payment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000 }
            - { name: metrics, containerPort: 9100 }
          env:
            - name: SERVICE_NAME
              value: "payment-service"
            - name: DATABASE_URL
              value: "postgres://payment_svc:payment_svc@postgres:5432/payment_db"
            - name: DB_POOL_MAX
              value: "3"
            - name: THIRDPARTY_URL
              value: "http://thirdparty-mock.tokoku-infra.svc.cluster.local:4000"
            - name: JWT_SECRET
              value: "tokoku-demo-secret"
            - name: PASSWORD_HASH_ITERATIONS
              value: "100000"
            - name: FRAUD_CHECK_ROUNDS
              value: "2000"
            - name: RABBITMQ_URL
              value: "amqp://tokoku:tokoku@rabbitmq:5672"
            - name: WORKERS
              value: "1"
          # requests = limits -> QoS "Guaranteed", same resources as the docker compose version
          resources:
            requests: { cpu: "300m", memory: 192Mi }
            limits: { cpu: "300m", memory: 192Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  labels: { app: payment-service }
spec:
  selector: { app: payment-service }
  ports:
    - { name: http, port: 3000, targetPort: http }
---
# Headless service: DNS returns the IPs of ALL pods -> nginx balances load per request
# and picks up new pods automatically on scale (same as Docker DNS in compose).
apiVersion: v1
kind: Service
metadata:
  name: payment-service-headless
spec:
  clusterIP: None
  selector: { app: payment-service }
  ports:
    - { name: http, port: 3000, targetPort: http }

---
# Horizontal autoscaling: add replicas when average CPU > 70% of the request.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-service
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: payment-service }
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
