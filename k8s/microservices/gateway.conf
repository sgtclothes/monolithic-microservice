upstream user_service {
  zone user_service 64k;
  resolver kube-dns.kube-system.svc.cluster.local valid=5s ipv6=off;
  server user-service-headless.tokoku-ms.svc.cluster.local:3000 resolve;
  keepalive 64;
}
upstream product_service {
  zone product_service 64k;
  resolver kube-dns.kube-system.svc.cluster.local valid=5s ipv6=off;
  server product-service-headless.tokoku-ms.svc.cluster.local:3000 resolve;
  keepalive 128;
}
upstream order_service {
  zone order_service 64k;
  resolver kube-dns.kube-system.svc.cluster.local valid=5s ipv6=off;
  server order-service-headless.tokoku-ms.svc.cluster.local:3000 resolve;
  keepalive 128;
}
upstream notification_service {
  zone notification_service 64k;
  resolver kube-dns.kube-system.svc.cluster.local valid=5s ipv6=off;
  server notification-service-headless.tokoku-ms.svc.cluster.local:3000 resolve;
  keepalive 32;
}

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Request-Id $request_id;
proxy_read_timeout 30s;

server {
  listen 80;
  add_header X-Served-By $upstream_addr always;
  add_header X-Architecture microservices always;

  location = /api/info {
    default_type application/json;
    return 200 '{"arch":"microservices","gateway":"nginx","platform":"kubernetes"}';
  }

  location /api/users         { proxy_pass http://user_service; }
  location /api/products      { proxy_pass http://product_service; }
  location /api/orders        { proxy_pass http://order_service; }
  location /api/notifications { proxy_pass http://notification_service; }

  location /api/ {
    default_type application/json;
    return 404 '{"error":{"code":"NOT_FOUND","message":"Route not recognized by the API gateway"}}';
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
